<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | Guitar Toolbox</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c0f14">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg-main: #0c0f14;
      --bg-card: #1c2331;
      --accent-gold: #f59e0b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 0%, #1b2434 0%, var(--bg-main) 60%);
      color: var(--text-primary);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }

    .card {
      max-width: 520px;
      padding: 40px 32px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 20px;
      background: var(--bg-card);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }

    .icon { font-size: 48px; line-height: 1; }

    h1 {
      margin: 16px 0 8px;
      font-size: 28px;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 28px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-gold), #d97706);
      color: #1a1200;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible { outline: 3px solid #06b6d4; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🎸</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe nesta versão da Guitar Toolbox.</p>
    <a href="./">Voltar para as ferramentas</a>
  </main>
</body>
</html>
